<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barba Studio - Painel Administrativo</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- TELA DE SENHA ADMIN -->
  <div id="card-senha-admin" class="card" style="margin: 80px auto; max-width: 400px; text-align: center;">
    <h2 style="color:#f39c12; font-size:1.4rem;">ACESSO RESTRITO</h2>
    <p style="color:#aaa; font-size:0.85rem; margin-bottom:20px;">Insira a senha para aceder ao painel administrativo.</p>
    <form onsubmit="verificarSenhaAdmin(event)">
      <div class="form-group">
        <input type="password" id="senha-admin-input" placeholder="****" style="text-align:center;" required>
      </div>
      <button type="submit" class="btn-primary" style="background:#f39c12; color:#121212;">Entrar</button>
    </form>
    <a href="index.html" class="link-voltar" style="margin-top:15px; display:block;">← Voltar</a>
  </div>

  <!-- PAINEL ADMINISTRATIVO REAL -->
  <div id="conteudo-admin" class="hidden" style="width: 100%; max-width: 1100px; margin: 0 auto;">
    <header style="width:100%; max-width:100%;">
      <h1>BARBA STUDIO <span style="font-size:0.8rem; color:#aaa;">- PAINEL ADMINISTRATIVO</span></h1>
      <a href="index.html" class="btn-admin">← Voltar</a>
    </header>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0;">
      <div class="card" style="max-width:100%; margin:0; text-align:center; padding:15px;">
        <span style="font-size:0.75rem; color:#aaa; text-transform:uppercase;">TOTAL GERAL</span>
        <h2 id="stat-total" style="font-size:2rem; margin-top:5px;">0</h2>
      </div>
      <div class="card" style="max-width:100%; margin:0; text-align:center; padding:15px;">
        <span style="font-size:0.75rem; color:#aaa; text-transform:uppercase;">HOJE</span>
        <h2 id="stat-hoje" style="font-size:2rem; margin-top:5px;">0</h2>
      </div>
      <div class="card" style="max-width:100%; margin:0; text-align:center; padding:15px;">
        <span style="font-size:0.75rem; color:#aaa; text-transform:uppercase;">BARBEIROS</span>
        <h2 id="stat-barbeiros" style="font-size:2rem; margin-top:5px;">0</h2>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px;">
      <!-- GESTÃO DE BARBEIROS -->
      <div class="card" style="max-width:100%; margin:0;">
        <h2>✂️ GESTÃO DE BARBEIROS</h2>
        <div class="form-group" style="margin-top:15px;">
          <label>Barbeiros cadastrados:</label>
          <div id="lista-barbeiros-admin" style="max-height: 150px; overflow-y: auto; background:#111; border:1px solid #333; border-radius:5px; margin-top:5px;">
            <!-- Barbeiros via JS -->
          </div>
        </div>
        <div class="form-group">
          <input type="text" id="novo-barbeiro-nome" placeholder="Nome do novo barbeiro">
        </div>
        <button class="btn-primary" style="background:#1e8449; margin-bottom:10px;" onclick="cadastrarBarbeiroAdmin()">+ Cadastrar Novo Barbeiro</button>
        <button class="btn-primary" style="background:#117864; margin-bottom:10px;" onclick="listarClientesAdmin()">Todos Clientes Cadastrados</button>
        <button class="btn-primary" style="background:#c0392b;" onclick="excluirBarbeiroSelecionado()">Excluir Barbeiro Selecionado</button>
      </div>

      <!-- TODOS OS AGENDAMENTOS -->
      <div class="card" style="max-width:100%; margin:0;">
        <h2>📅 TODOS OS AGENDAMENTOS</h2>
        <div style="overflow-x: auto; margin-top:15px;">
          <table style="width:100%; border-collapse:collapse; font-size:0.85rem;">
            <thead>
              <tr style="border-bottom:1px solid #333; text-align:left;">
                <th style="padding:8px; color:#f39c12;">ID</th>
                <th style="padding:8px; color:#f39c12;">Barbeiro</th>
                <th style="padding:8px; color:#f39c12;">Cliente</th>
                <th style="padding:8px; color:#f39c12;">Data</th>
                <th style="padding:8px; color:#f39c12;">Hora</th>
                <th style="padding:8px; color:#f39c12;">Ação</th>
              </tr>
            </thead>
            <tbody id="tabela-agendamentos">
              <tr><td colspan="6" style="padding:15px; text-align:center; color:#777;">Nenhum agendamento encontrado.</td></tr>
            </tbody>
          </table>
        </div>
        <button class="btn-primary" style="background:#f39c12; color:#121212; margin-top:20px;" onclick="window.print()">🖨️ Baixar Relatório (PDF)</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://amdiaevxeajvqktdrbnz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtZGlhZXZ4ZWFqdnFrdGRyYm56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MTEzMjMsImV4cCI6MjEwODk4NzMyM30.8Dt7jMKYa49BU7b8LgArnRvKzOhPZCpBMqpz3uVfhL8";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let barbeiroSelecionadoId = null;

    function verificarSenhaAdmin(event) {
      event.preventDefault();
      const senha = document.getElementById("senha-admin-input").value.trim();
      if (senha === "1234" || senha === "admin") {
        document.getElementById("card-senha-admin").classList.add("hidden");
        document.getElementById("conteudo-admin").classList.remove("hidden");
        carregarDadosAdmin();
      } else {
        alert("Senha incorreta.");
      }
    }

    async function carregarDadosAdmin() {
      await carregarBarbeirosAdmin();
      await carregarAgendamentosAdmin();
    }

    async function carregarBarbeirosAdmin() {
      const container = document.getElementById("lista-barbeiros-admin");
      const { data, error } = await _supabase.from("profissionais").select("*").order("id", { ascending: true });
      
      if (error || !data) {
        container.innerHTML = '<div style="padding:8px; color:#aaa;">Erro ao carregar</div>';
        document.getElementById("stat-barbeiros").innerText = "0";
        return;
      }

      document.getElementById("stat-barbeiros").innerText = data.length;
      if (data.length === 0) {
        container.innerHTML = '<div style="padding:8px; color:#aaa;">Nenhum barbeiro registado.</div>';
        return;
      }

      container.innerHTML = "";
      data.forEach(b => {
        const div = document.createElement("div");
        div.style.cssText = "padding:8px 12px; border-bottom:1px solid #222; cursor:pointer;";
        if (barbeiroSelecionadoId === b.id) div.style.background = "#f39c12", div.style.color = "#121212";
        div.innerText = b.nome;
        div.onclick = () => {
          barbeiroSelecionadoId = b.id;
          carregarBarbeirosAdmin();
        };
        container.appendChild(div);
      });
    }

    async function cadastrarBarbeiroAdmin() {
      const nomeInput = document.getElementById("novo-barbeiro-nome");
      const nome = nomeInput.value.trim();
      if (!nome) return alert("Introduza o nome do barbeiro.");

      const { error } = await _supabase.from("profissionais").insert([{ nome }]);
      if (error) alert("Erro ao cadastrar barbeiro.");
      else {
        alert("Barbeiro cadastrado com sucesso!");
        nomeInput.value = "";
        carregarBarbeirosAdmin();
      }
    }

    async function excluirBarbeiroSelecionado() {
      if (!barbeiroSelecionadoId) return alert("Selecione um barbeiro na lista acima.");
      if (!confirm("Tem certeza que deseja excluir este barbeiro?")) return;

      const { error } = await _supabase.from("profissionais").delete().eq("id", barbeiroSelecionadoId);
      if (error) alert("Erro ao excluir.");
      else {
        alert("Barbeiro excluído com sucesso!");
        barbeiroSelecionadoId = null;
        carregarBarbeirosAdmin();
      }
    }

    async function carregarAgendamentosAdmin() {
      const tbody = document.getElementById("tabela-agendamentos");
      const { data, error } = await _supabase.from("agendamentos").select(`id, cliente_nome, data_agendamento, hora_agendamento, profissional_id, profissionais(nome)`).order("data_agendamento", { ascending: true });

      if (error || !data) {
        tbody.innerHTML = `<tr><td colspan="6" style="padding:15px; text-align:center; color:#c0392b;">Erro ao carregar agendamentos.</td></tr>`;
        return;
      }

      document.getElementById("stat-total").innerText = data.length;
      const hojeStr = new Date().toISOString().split('T')[0];
      const agendamentosHoje = data.filter(a => a.data_agendamento === hojeStr);
      document.getElementById("stat-hoje").innerText = agendamentosHoje.length;

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="padding:15px; text-align:center; color:#777;">Nenhum agendamento encontrado.</td></tr>`;
        return;
      }

      tbody.innerHTML = "";
      data.forEach(a => {
        const nomeBarbeiro = a.profissionais ? a.profissionais.nome : "Desconhecido";
        tbody.innerHTML += `
          <tr style="border-bottom:1px solid #222;">
            <td style="padding:8px;">#${a.id}</td>
            <td style="padding:8px;">${nomeBarbeiro}</td>
            <td style="padding:8px;">${a.cliente_nome}</td>
            <td style="padding:8px;">${a.data_agendamento}</td>
            <td style="padding:8px;">${a.hora_agendamento}</td>
            <td style="padding:8px;"><button onclick="excluirAgendamento(${a.id})" style="background:#c0392b; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Cancelar</button></td>
          </tr>
        `;
      });
    }

    async function excluirAgendamento(id) {
      if (!confirm("Deseja cancelar este agendamento?")) return;
      const { error } = await _supabase.from("agendamentos").delete().eq("id", id);
      if (error) alert("Erro ao cancelar.");
      else carregarAgendamentosAdmin();
    }

    async function listarClientesAdmin() {
      const { data, error } = await _supabase.from("clientes").select("nome, telefone, email");
      if (error || !data || data.length === 0) return alert("Nenhum cliente cadastrado.");
      let lista = "CLIENTES CADASTRADOS:\n\n";
      data.forEach(c => lista += `• ${c.nome} | Tel: ${c.telefone}\n`);
      alert(lista);
    }
  </script>
</body>
</html>
